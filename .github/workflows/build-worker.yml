name: Build worker image

# Runs on a native amd64 runner, which is the whole point: building this image on
# an Apple Silicon machine means emulating x86_64 for every layer, including the
# two that instantiate torch to download model weights.

on:
  push:
    branches: [main]
    paths:
      - "bass-transcribe-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bass-transcribe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # A hosted runner has roughly 14GB free on /, and this image is 8-12GB with
      # weights baked in. Stripping the preinstalled toolchains buys ~25GB and is
      # the difference between a build and a "no space left on device".
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./bass-transcribe-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache rather than type=gha: the Actions cache caps at 10GB per
          # repo, which this image would blow on its own. Drop both lines if GHCR
          # storage becomes a concern -- it only costs build time.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Image size drives container pull time, which is most of cold start on a
      # scale-to-zero endpoint. Surfacing it here means every build reports the
      # number Phase 2 cares about instead of it being a thing you go look up.
      - name: Report image size
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          RAW=$(docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" --raw)

          # build-push-action attaches provenance attestations by default, so the
          # build digest points at an OCI index holding the image manifest *and* an
          # attestation manifest -- there is no .layers at that level. Resolve the
          # linux/amd64 image first. Handles the plain-manifest case too, in case
          # attestations are ever turned off.
          if [ "$(echo "$RAW" | jq -r 'has("manifests")')" = "true" ]; then
            SUB=$(echo "$RAW" | jq -r '
              .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "amd64")
              | .digest' | head -1)
            RAW=$(docker buildx imagetools inspect "$IMAGE@$SUB" --raw)
          fi

          COMPRESSED=$(echo "$RAW" | jq '[.layers[].size] | add')
          LAYERS=$(echo "$RAW" | jq '.layers | length')
          HUMAN=$(numfmt --to=iec "$COMPRESSED")

          # Also to stdout: the job summary is not retrievable through `gh run view`,
          # so without this the number is only readable in a browser.
          echo "IMAGE_SIZE_COMPRESSED_BYTES=$COMPRESSED"
          echo "IMAGE_SIZE_COMPRESSED=$HUMAN"
          echo "IMAGE_LAYERS=$LAYERS"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"

          {
            echo "### Worker image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Compressed layers | $HUMAN |"
            echo "| Layers | $LAYERS |"
            echo ""
            echo "Compressed size is what Runpod downloads; on-disk is larger."
            echo "Pull this from a Runpod endpoint as:"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
